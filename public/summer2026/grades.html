<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Dashboard - Notes.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=8">
    <link rel="stylesheet" href="/css/grades.css?v=1">
</head>

<body>
    <main class="container">
        <header>
            <a href="/summer2026/index.html" class="back-link">← Back to Dashboard</a>
            <h1>Grade Dashboard</h1>
            <p class="subtitle">Track your academic performance across all courses.</p>
        </header>

        <div id="final-grade-banner" class="final-grade-banner" style="display: none;">
            <span class="final-grade-label">Final Grade</span>
            <select id="final-grade-select" class="final-grade-select">
                <option value="">— Not set —</option>
                <option value="A+">A+</option>
                <option value="A">A</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B">B</option>
                <option value="B-">B-</option>
                <option value="C+">C+</option>
                <option value="C">C</option>
                <option value="C-">C-</option>
                <option value="D+">D+</option>
                <option value="D">D</option>
                <option value="D-">D-</option>
                <option value="F">F</option>
            </select>
            <span id="banner-computed-avg"></span>
        </div>

        <div id="grade-list">
            <p class="loading-text">Loading grades...</p>
        </div>

    </main>

    <!-- Load config for the schemes -->
    <script src="/js/student-config-summer2026.js?v=2"></script>

    <script type="module" src="/js/grades-page.js"></script>
</body>

</html>
