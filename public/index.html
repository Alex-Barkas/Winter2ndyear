<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex's Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/sports_car_favicon.png">
    <link rel="stylesheet" href="css/style.css?v=7">
    <meta name="description" content="Archive of course materials and notes from my undergraduate studies.">
    <style>
        .term-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }

        .term-status {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="signature-badge">
        <div class="signature-row">
            <span class="signature-text">alex barkas 2026</span>
        </div>
        <div class="nav-divider"></div>
        <nav class="side-nav">
            <a href="todo.html" class="nav-link">to-do</a>
        </nav>
    </div>

    <main class="container">
        <!-- Header -->
        <header>
            <div class="header-titling">
                <h1>Alex Barkas' Dashboard</h1>
                <p class="subtitle">Pick a semester to view courses, assignments, and grades.</p>
            </div>
        </header>

        <!-- Content -->
        <div class="content-stack">
            <section>
                <h2 class="section-label">SEMESTERS</h2>
                <div id="term-list" class="list-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">

                    <div class="course-card term-card">
                        <div class="course-header">
                            <span class="course-code">WINTER 2026</span>
                            <span class="course-title">Completed Semester</span>
                        </div>
                        <div class="course-actions">
                            <a href="winter2026.html" class="action-btn primary">
                                <span>Enter</span>
                            </a>
                        </div>
                    </div>

                    <div class="course-card term-card">
                        <div class="course-header">
                            <span class="course-code">SUMMER 2026</span>
                            <span class="course-title">In Progress</span>
                        </div>
                        <div class="course-actions">
                            <a href="summer2026.html" class="action-btn primary">
                                <span>Enter</span>
                            </a>
                        </div>
                    </div>

                    <div class="course-card term-card">
                        <div class="course-header">
                            <span class="course-code">FALL 2026</span>
                            <span class="course-title">Coming Soon</span>
                        </div>
                        <div class="course-actions">
                            <a href="fall2026.html" class="action-btn secondary">
                                <span>Enter</span>
                            </a>
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </main>
</body>

</html>
