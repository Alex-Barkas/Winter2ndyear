<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Notes.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/maple_leaf_favicon.png">
    <link rel="stylesheet" href="css/style.css?v=8">
    <link rel="stylesheet" href="css/list-ui.css?v=1">
    <link rel="stylesheet" href="css/todo.css?v=1">

    <!-- Merge courses across all terms for the "Course" dropdown below. Each
         config assigns straight onto window, so all three can load in sequence. -->
    <script src="js/student-config-winter2026.js?v=2"></script>
    <script>window.__coursesWinter2026 = window.STUDENT_DATA.courses;</script>
    <script src="js/student-config-summer2026.js?v=2"></script>
    <script>window.__coursesSummer2026 = window.STUDENT_DATA.courses;</script>
    <script src="js/student-config-fall2026.js?v=2"></script>
    <script>window.__coursesFall2026 = window.STUDENT_DATA.courses;</script>
    <script>
        window.STUDENT_DATA.courses = [
            ...window.__coursesWinter2026,
            ...window.__coursesSummer2026,
            ...window.__coursesFall2026
        ];
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <main class="container">
        <header>
            <a href="index.html" class="back-link">← Back to Dashboard</a>
            <h1>To-Do List</h1>
            <p class="subtitle">Manage everything. Prioritize what matters.</p>
        </header>

        <!-- Add form -->
        <div class="todo-input-container">
            <input type="text" id="task-title" class="input-field" placeholder="What needs to be done?">

            <select id="task-course" class="input-field">
                <option value="Personal">Personal</option>
                <!-- Course optgroups injected per term -->
            </select>

            <select id="task-urgency" class="input-field" title="Urgency Level">
                <option value="1">1 - Trivial</option>
                <option value="2">2 - Low</option>
                <option value="3" selected>3 - Normal</option>
                <option value="4">4 - High</option>
                <option value="5">5 - Critical</option>
            </select>

            <input type="date" id="task-date" class="input-field" title="Optional Due Date">

            <button id="add-btn" class="add-btn">Add</button>
        </div>

        <div id="todo-summary"></div>
        <div id="todo-controls" class="list-controls"></div>
        <div id="todo-container" class="list-grid"></div>
    </main>

    <script type="module" src="js/todo-page.js?v=1"></script>
</body>

</html>
