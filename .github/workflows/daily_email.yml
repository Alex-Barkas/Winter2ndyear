name: Daily Agenda Email

on:
  schedule:
    # GitHub starts scheduled runs hours late (4-8h has been typical), so this is set
    # for the middle of the night: 05:30 UTC = 1:30 AM EDT / 12:30 AM EST. Even a
    # late start lands before morning. TZ below keeps "today" on Toronto's date.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Toronto

    steps:
    - name: Skip if today's email already sent
      id: guard
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        today=$(date +%F)
        for ts in $(gh run list -R "$GITHUB_REPOSITORY" --workflow daily_email.yml --status success --limit 10 --json createdAt -q '.[].createdAt'); do
          if [ "$(date -d "$ts" +%F)" = "$today" ]; then
            echo "Email already sent today ($ts), skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

    - name: Checkout code
      if: steps.guard.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Set up Python
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install requests firebase-admin

    - name: Create Service Account Key
      if: steps.guard.outputs.skip != 'true'
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      run: |
        printf '%s' "$FIREBASE_KEY" > firebase_credentials.json
        chmod 600 firebase_credentials.json

    - name: Run Auto Email Script (REST API)
      if: steps.guard.outputs.skip != 'true'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: firebase_credentials.json
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        # SENDER_EMAIL and RECEIVER_EMAIL use defaults in auto_email_rest.py
        # unless you add them to secrets and uncomment below:
        # SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        # RECEIVER_EMAIL: ${{ secrets.TARGET_EMAIL }}
      run: python -u scripts/auto_email_rest.py
