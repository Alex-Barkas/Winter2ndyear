name: Daily Agenda Email

on:
  schedule:
    # 10:07 UTC = 6:07 AM EDT (until Nov 1) / 5:07 AM EST (after)
    - cron: '7 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests firebase-admin

    - name: Create Service Account Key
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      run: |
        printf '%s' "$FIREBASE_KEY" > firebase_credentials.json
        chmod 600 firebase_credentials.json

    - name: Run Auto Email Script (REST API)
      env:
        GOOGLE_APPLICATION_CREDENTIALS: firebase_credentials.json
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        # SENDER_EMAIL and RECEIVER_EMAIL use defaults in auto_email_rest.py
        # unless you add them to secrets and uncomment below:
        # SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        # RECEIVER_EMAIL: ${{ secrets.TARGET_EMAIL }}
      run: python -u scripts/auto_email_rest.py
